# ALMA-style SFT for the S model: parallel en<->bg translation fine-tuning.
#
# Prereqs:
#   1. A pretrained (or continual-pretrained) checkpoint -> `init_from` below.
#   2. Packed SFT data built once (FLORES+ dev + WMT24++, both directions):
#        python scripts/prepare_sft_data.py \
#          --data-dir /scratch-shared/mivanov1/hnet/data \
#          --out-name sft-alma-en-bg \
#          --pairs eng_Latn:bul_Cyrl bul_Cyrl:eng_Latn \
#          --wmt24pp eng_Latn:bul_Cyrl bul_Cyrl:eng_Latn \
#          --flores-split dev --val-fraction 0.05
#
# Launch:  python train.py --config configs/comparison/S/hnet_sft_S_en_bul.yaml

# --- Model (MUST match the init_from checkpoint's architecture) ---
model_config: configs/comparison/S/hnet_1stage_S.json
lr_multiplier: null

# --- SFT mode ---
sft: true                       # read paired token+label streams; loss on target only
sft_name: sft-alma-en-bg        # <data_dir>/<sft_name>/{train,val}.bin + labels_*.bin
# Warm-start weights from the bilingual base; fresh optimizer + step 0 (NOT resume).
init_from: /scratch-shared/mivanov1/hnet/checkpoints/train/comparison/S/hnet_1stage_S_en_bul/latest.pt
resume: false

# --- Optimizer (low LR, short run — standard for SFT) ---
lr: 1e-5                        # ALMA uses ~2e-5 for 7B full-FT; 1e-5 is a safe start here
weight_decay: 0.1
betas: [0.9, 0.95]
max_grad_norm: 1.0

# --- LR Schedule ---
lr_schedule: cosine
warmup_steps: 30                # must stay < max_steps
min_lr: 1e-6

# --- Loss (keep routing aux losses ON so the chunker stays healthy) ---
alpha: 0.03
ortho_reg_lambda: 0.0
downsample_n: 4
bm_loss_weight: 0.0

# --- Data ---
data_dir: /scratch-shared/mivanov1/hnet/data
seq_len: 1024                   # translation examples are short; packs a few per chunk
seed: 42

# --- Batch ---
batch_size: 8
grad_accum_steps: 4             # effective batch = 8 * 4 * world_size
num_workers: 4

# --- Training ---
# Small corpus => few steps. Recompute when you change data/batch/seq_len:
#   steps_per_epoch = size(<data_dir>/<sft_name>/train.bin) / (batch_size*grad_accum*world*seq_len)
#   max_steps ~= (1-3) * steps_per_epoch
# Default below ~= 3 epochs over FLORES-dev + WMT24++ en<->bg (~1.9M train tokens,
# ~59 steps/epoch at batch8*accum4*seq1024 on 1 GPU).
max_steps: 180
total_tokens: null

# --- Validation (val/loss is per-target-byte CE in SFT) ---
validate_every: 30
val_batches: 20

# --- Checkpointing ---
checkpoint_dir: /scratch-shared/mivanov1/hnet/checkpoints/train/comparison/S/hnet_sft_S_en_bul
save_every: 30

# --- Logging ---
log_every: 5
wandb_project: "hnet"
wandb_run_name: "sft_hnet_S_en_bul_alma"

# --- Memory ---
activation_checkpointing: false
compile: false
