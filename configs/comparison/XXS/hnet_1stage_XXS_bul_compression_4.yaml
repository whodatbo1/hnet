# HNet Training Configuration
# Override any field via CLI: python train.py --config configs/train/default.yaml --lr 1e-3

# --- Model ---
model_config: configs/comparison/XXS/hnet_1stage_XXS.json

# Per-stage LR multipliers (outer to inner). Set to null to disable.
# Example for 2-stage: [3.0, 1.7, 0.9]
lr_multiplier: null

# --- Optimizer ---
lr: 4e-4
weight_decay: 0.1
betas: [0.9, 0.95]
max_grad_norm: 1.0

# --- LR Schedule (Warmup-Stable-Decay) ---
lr_schedule: wsd     # Linear warmup + cosine decay to min_lr (matches Megatron Llama baseline)
decay_fraction: 0.1
warmup_steps: 100       # Matches Megatron's LR_WARMUP_ITERS default
min_lr: 4e-5            # Matches MIN_LR in the S_200M Llama configs

# --- Loss ---
alpha: 0.03                  # Load balancing loss weight
ortho_reg_lambda: 0.0     # Orthogonal regularization of BP matrices loss weight
downsample_n: 4              # Expected downsampling factor N
bm_loss_weight: 0.0          # Byte-modelling loss of encoder used for entropy routing

# --- Data ---
data_dir: /scratch-shared/mivanov1/hnet/data  # Local data root (download with download_data.py)
dataset_mixture: [
  {
    name: hplt-bul_Cyrl,
    weight: 1.0
  }
]
seq_len: 8192
seed: 42

# --- Batch ---
batch_size: 64           # Micro batch size per GPU
grad_accum_steps: 4      # Gradient accumulation steps
num_workers: 8           # Dataloader workers (can use >0 with local data)

# --- Training ---
max_steps: null
total_tokens: 20_000_000_000

# --- Validation ---
validate_every: 100       # Run validation every N steps (0 to disable)
val_fraction: 0.005       # Fraction of streaming documents reserved for validation (0.5%)
val_batches: 128          # Number of micro-batches per validation run

# --- Checkpointing ---
checkpoint_dir: /scratch-shared/mivanov1/hnet/checkpoints/train/comparison/XXS/hnet_1stage_XXS_bul_compression_4
save_every: 100
resume: true

# --- Logging ---
log_every: 10
wandb_project: "hnet"      # Set to enable wandb (e.g. "hnet-training")
wandb_run_name: "train_hnet_1stage_XXS_bul_compression_4"

# --- Memory ---
activation_checkpointing: false

# --- Compile ---
compile: false